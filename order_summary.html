<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sweet Scoop Ice Cream Order Summary</title>
</head>

<body>
    <header>
        <img src="assets/logo.jpeg" width="70" height="70" alt="Logo Image">
        <h1>Sweet Scoop Ice Cream</h1>
    </header>

    <div class="navbar">
        <a href="index.html">Home</a> 
        <a href="menu_view.html">Menu</a> 
    </div>

    <main class="summary">
        <h2>Order Summary</h2>

        <table>
            <tr>
                <th>Item</th>
                <th>Details</th>
            </tr>
            <tr>
                <td>Ice Cream</td>
                <td>Vanilla Dream</td>
            </tr>
            <tr>
                <td>Type</td>
                <td>Cone</td>
            </tr>
            <tr>
                <td>Toppings</td>
                <td>Sprinkles, Nuts</td>
            </tr>
            <tr>
                <td>Total Price</td>
                <td>$6.50</td>
            </tr>
        </table>

        <br>
        <button onclick="window.location.href='customize_order.html'">Edit Order</button>
        <button>Confirm Order</button>
    </main>

    <footer>
        <div>© 2026 Sweet Scoop Ice Cream</div>
    </footer>

</html>
