<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sweet Scoop Ice Cream Login</title>
</head>
<body>
    <header>
        <img src="assets/logo.jpeg" width="70" height="70" alt="Logo Image">
        <h1>Sweet Scoop Ice Cream</h1>
    </header>

    <div class="navbar">
        <a href="index.html">Home</a> 
    </div>

<main class="customiza">
    <img src="assets/Picture2.jpeg" alt="Ice Cream Banner" class="banner">

    <form>
        <section class="customs">
            <h2>Vanilla Dream</h2>
            <p>Choose Type</p>
            <input type="radio" id="cup" name="vanilla-type" value="cup">
            <label for="cup">Cup</label><br>
            <input type="radio" id="cone" name="vanilla-type" value="cone">
            <label for="cone">Cone</label><br>
            <button type="button" class="button">Submit Selection</button>
        </section>

        <section class="customs">
            <h2>Chocolate Bliss</h2>
            <p>Select Toppings</p>
            <input type="checkbox" id="sprinkles" name="chocolate-type" value="sprinkles">
            <label for="sprinkles">Sprinkles</label><br>
            <input type="checkbox" id="nuts" name="chocolate-type" value="nuts">
            <label for="nuts">Nuts</label><br>
            <input type="checkbox" id="caramel" name="chocolate-type" value="caramel">
            <label for="caramel">Caramel</label><br>
            <button type="button" class="button">Submit Selection</button>
        </section>

        <div class="finish-container">
            <a href="order_summary.html" class="btn-finish">Finish Order</a>
        </div>
    </form>
</main>


    <footer>
        <div>© 2026 Sweet Scoop Ice Cream</div>
    </footer>

</body>
</html>
